<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="2"/>
    <circle cx="240" cy="140" r="1.5"/>
    <circle cx="380" cy="60" r="2"/>
    <circle cx="520" cy="180" r="1"/>
    <circle cx="680" cy="100" r="2.5"/>
    <circle cx="820" cy="50" r="1.5"/>
    <circle cx="960" cy="160" r="2"/>
    <circle cx="1100" cy="90" r="1.5"/>
    <circle cx="80" cy="500" r="2"/>
    <circle cx="220" cy="560" r="1.5"/>
    <circle cx="400" cy="540" r="1"/>
    <circle cx="560" cy="580" r="2"/>
    <circle cx="740" cy="510" r="1.5"/>
    <circle cx="900" cy="570" r="2"/>
    <circle cx="1060" cy="540" r="1.5"/>
  </g>

  <!-- Platforms -->
  <rect x="180" y="380" width="180" height="14" rx="4" fill="#4ade80" opacity="0.7"/>
  <rect x="440" y="320" width="180" height="14" rx="4" fill="#4ade80" opacity="0.85"/>
  <rect x="700" y="260" width="180" height="14" rx="4" fill="#4ade80"/>
  <rect x="940" y="200" width="180" height="14" rx="4" fill="#facc15"/>

  <!-- Player -->
  <g transform="translate(800,210)">
    <rect x="-22" y="-30" width="44" height="40" rx="6" fill="#4ade80"/>
    <rect x="-14" y="-20" width="8" height="6" fill="#0a0a1a"/>
    <rect x="6" y="-20" width="8" height="6" fill="#0a0a1a"/>
    <rect x="-10" y="-6" width="20" height="3" fill="#0a0a1a"/>
    <!-- Booster flames -->
    <polygon points="-22,10 -10,10 -16,28" fill="#facc15"/>
    <polygon points="10,10 22,10 16,28" fill="#facc15"/>
  </g>

  <!-- Title -->
  <text x="600" y="460" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="96" font-weight="900" fill="url(#title)" letter-spacing="-2">CHIEF JUMPER</text>

  <!-- Subtitle -->
  <text x="600" y="510" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="500" fill="#94a3b8" letter-spacing="2">CLIMB THE CORPORATE LADDER</text>
</svg>
